<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>受験管理アプリ 2027 - 新しいURLに移りました</title>
<link rel="canonical" href="https://juken-app-sigma.vercel.app/">
<noscript><meta http-equiv="refresh" content="0; url=https://juken-app-sigma.vercel.app/"></noscript>
<!--
  旧公開先（GitHub Pages / Firebase Hosting）用の転送ページ。
  アプリ本体は Vercel（https://juken-app-sigma.vercel.app/）に一本化した。
  ・ブラウザで開いた場合は、すぐに Vercel 版へ移動する（?〜 と #key=〜 も引き継ぐ）
  ・ホーム画面のアイコン（スタンドアロン）から開いた場合は、移動先で
    「ホーム画面に追加」し直してもらう必要があるので、案内を出してボタンで移動する
  ・旧アプリの Service Worker とキャッシュはここで解除する（sw.js も同じ役目）
-->
<style>
:root{--bg:#F2F2F7;--card:#FFFFFF;--text:#1a1a14;--muted:#6E6E73;--accent:#007AFF;--border:rgba(0,0,0,0.10)}
@media (prefers-color-scheme: dark){:root{--bg:#000000;--card:#1C1C1E;--text:#FFFFFF;--muted:#A1A1A6;--border:rgba(255,255,255,0.14)}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--border);border-radius:22px;padding:28px 22px;text-align:center}
.ico{font-size:44px;margin-bottom:10px}
h1{font-size:19px;line-height:1.5;margin-bottom:10px}
p{font-size:14px;line-height:1.75;color:var(--muted);margin-bottom:12px}
.url{display:inline-block;font-size:13px;font-weight:700;color:var(--text);background:var(--bg);border-radius:10px;padding:6px 10px;margin-bottom:18px;word-break:break-all}
.btn{display:block;width:100%;padding:14px 16px;border-radius:14px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;text-decoration:none}
.steps{display:none;text-align:left;background:var(--bg);border-radius:14px;padding:14px 16px;margin:4px 0 18px}
.steps ol{padding-left:20px;font-size:13px;line-height:1.8}
.standalone .steps{display:block}
</style>
</head>
<body>
<div class="box">
  <div class="ico">📚</div>
  <h1>受験管理アプリは<br>新しいURLに移りました</h1>
  <p>記録はクラウドに保存されているので、新しいURLでもそのまま使えます。</p>
  <div class="url">juken-app-sigma.vercel.app</div>
  <div class="steps">
    <ol>
      <li>下のボタンで新しいURLを開く（Safari で開きます）</li>
      <li>共有ボタン（□↑）→「ホーム画面に追加」</li>
      <li>このアイコンはホーム画面から削除してOK</li>
    </ol>
  </div>
  <a class="btn" id="go" href="https://juken-app-sigma.vercel.app/">新しいURLで開く</a>
</div>
<script>
(function () {
  var target = 'https://juken-app-sigma.vercel.app/' + location.search + location.hash;
  document.getElementById('go').href = target;

  // 旧アプリの Service Worker とキャッシュを片付ける（古い画面が出続けないように）
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) {
      navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { r.unregister(); }); });
    }
    if (window.caches && caches.keys) {
      caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
    }
  } catch (e) {}

  var standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  if (standalone) {
    // ホーム画面のアイコンから開いた場合は、追加し直す手順を見せてからボタンで移動してもらう
    document.documentElement.className = 'standalone';
  } else {
    location.replace(target);
  }
})();
</script>
</body>
</html>
